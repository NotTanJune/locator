name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    # Path filters are not applied to tag pushes. A main push runs this same
    # build job so the release-profile cache is saved on the default branch,
    # which is the only cache a later tag run can restore.
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "**/build.rs"
      - "src/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: lctr-aarch64-apple-darwin.tar.gz
            full_archive: lctr-full-aarch64-apple-darwin.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: lctr-x86_64-unknown-linux-gnu.tar.gz
            full_archive: lctr-full-x86_64-unknown-linux-gnu.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: lctr-x86_64-pc-windows-msvc.zip
            full_archive: lctr-full-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The runner image is part of the key, same as CI. An image bump
      # invalidates the llama.cpp build, and rust-cache will not overwrite an
      # exact hit. `release` and the target triple keep this cache apart from
      # CI's debug cache. rust-cache also hashes rustc and Cargo.lock.
      # An exact hit is restored and not written again.
      - name: Runner image cache key
        shell: bash
        run: echo "RUNNER_IMAGE_KEY=${ImageOS:-$RUNNER_OS}-${ImageVersion:-unknown}" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}-${{ env.RUNNER_IMAGE_KEY }}
          # Workspace crates stay out (the default), so the bundled-model
          # binary is not stored once per platform. Only main saves: a tag
          # run can restore the default branch, not another branch.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The llama.cpp submodule inside the llama-cpp-rs checkout has paths longer than the 260
      # character Windows limit. Without this, cargo fails with "path too long" while fetching it.
      - name: Allow long paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --system core.longpaths true
      # bindgen (used by llama-cpp-sys-2) needs libclang. The Windows runner has LLVM installed at
      # C:\Program Files\LLVM but does not put it on the search path. Set through GITHUB_ENV in a
      # Windows-only step, because a job-level value would also reach the Linux and macOS builds.
      - name: Point bindgen at LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: 'Add-Content -Path $env:GITHUB_ENV -Value "LIBCLANG_PATH=C:\Program Files\LLVM\bin"'
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      # Loose objects duplicate the static archives the link uses. Drop them
      # and keep lib/, common, and vendor/hash. The full build below is the
      # check that those archives still link.
      - name: Drop llama.cpp object files
        shell: bash
        run: |
          size_kib() { du -sk target | awk '{print $1}'; }
          before="$(size_kib)"
          find target -path '*llama-cpp-sys-*' -type f \( -name '*.o' -o -name '*.obj' -o -name '*.pdb' \) -delete
          after="$(size_kib)"
          echo "target directory ${before} KiB before dropping object files, ${after} KiB after"
      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/lctr" dist/
          cp README.md LICENSE dist/
          tar -C dist -czf "${{ matrix.archive }}" .
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/lctr.exe" dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.archive }}" -Force
      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
      # The file is pinned by revision and is the same on every OS. One cache
      # entry, written from Linux with a cross-OS archive.
      - name: Restore embedding model
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: model/embeddinggemma-2-Q8_0.gguf
          key: embeddinggemma-2-Q8_0-bfcd298762cc34d0357ece5ebdd31791a3a374d8
          enableCrossOsArchive: true
      - name: Fetch embedding model
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p model
          curl -fL --retry 3 -o model/embeddinggemma-2-Q8_0.gguf \
            "https://huggingface.co/ggml-org/embeddinggemma-2-GGUF/resolve/bfcd298762cc34d0357ece5ebdd31791a3a374d8/embeddinggemma-2-Q8_0.gguf"
      - name: Check embedding model
        shell: bash
        run: |
          model="model/embeddinggemma-2-Q8_0.gguf"
          size="$(wc -c < "$model" | tr -d ' ')"
          if [ "$size" != "309855456" ]; then
            echo "Model size is $size bytes, expected 309855456." >&2
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "$model" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "$model" | awk '{print $1}')"
          fi
          expected="2188ac1deca4b77dffefd603c2776a9d76d9d74ec01841392982ebb840b09135"
          if [ "$actual" != "$expected" ]; then
            echo "Model SHA-256 is $actual, expected $expected." >&2
            exit 1
          fi
          # LCTR_BUNDLED_MODEL must be an absolute path. Windows needs forward slashes for rustc.
          if [ "$RUNNER_OS" = "Windows" ]; then
            path="$(cygpath -m "$PWD/$model")"
          else
            path="$PWD/$model"
          fi
          echo "LCTR_BUNDLED_MODEL=$path" >> "$GITHUB_ENV"
      - name: Save embedding model
        if: steps.model-cache.outputs.cache-hit != 'true' && runner.os == 'Linux' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: model/embeddinggemma-2-Q8_0.gguf
          key: embeddinggemma-2-Q8_0-bfcd298762cc34d0357ece5ebdd31791a3a374d8
          enableCrossOsArchive: true
      # Full build: the same target with the embedding model compiled in. Runs after the lean
      # archive is packaged, because it overwrites target/<target>/release/lctr.
      - name: Build full
        run: cargo build --release --locked --target ${{ matrix.target }} --features bundled-model
      - name: Package full Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist-full
          cp "target/${{ matrix.target }}/release/lctr" dist-full/
          cp README.md LICENSE dist-full/
          tar -C dist-full -czf "${{ matrix.full_archive }}" .
      - name: Package full Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist-full -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/lctr.exe" dist-full/
          Copy-Item README.md, LICENSE dist-full/
          Compress-Archive -Path dist-full/* -DestinationPath "${{ matrix.full_archive }}" -Force
      - name: Upload full artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.full_archive }}
          path: ${{ matrix.full_archive }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Prepare release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          heading="# lctr v$version"

          awk -v heading="$heading" '
            $0 == heading { found = 1; print; next }
            found && $0 ~ /^# lctr v[0-9]/ { exit }
            found { print }
          ' release-notes.md > release-notes-current.md

          if ! grep -Fxq "$heading" release-notes-current.md; then
            echo "No release notes found for $GITHUB_REF_NAME." >&2
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes-current.md
          files: artifacts/*

  update-manifests:
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Check tag matches Cargo version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"

          if [ "$version" != "$cargo_version" ]; then
            echo "Tag $tag does not match Cargo.toml version $cargo_version." >&2
            exit 1
          fi
      - name: Update package manifests
        run: scripts/update-release-manifests.sh "$GITHUB_REF_NAME" artifacts
      - name: Test package manifest updater
        run: scripts/test-update-release-manifests.sh
      - name: Commit package manifest updates
        shell: bash
        run: |
          if git diff --quiet -- Formula/lctr.rb bucket/lctr.json; then
            echo "Package manifests already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/lctr.rb bucket/lctr.json
          git commit -m "chore: update package manifests for $GITHUB_REF_NAME"
          git push origin HEAD:main
